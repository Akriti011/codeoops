server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CodeOops's production environment.ts already uses a relative
    # apiBaseUrl ("/api/v1") — this is the reverse-proxy side of that
    # contract. Nothing in the Angular app needs a backend hostname baked in.
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF/CSV export and ZIP upload can legitimately take a while
        # (overview generation is a long-running job polled separately, but
        # the export endpoints and upload stream itself still need headroom).
        proxy_read_timeout 120s;
        client_max_body_size 250m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
